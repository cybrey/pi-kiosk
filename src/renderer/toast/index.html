<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Switch indicator</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; }
    #pill {
      max-width: calc(100% - 8px);
      padding: 10px 22px;
      border-radius: 999px;
      background: rgba(20, 22, 28, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      font: 600 17px/1.3 system-ui, sans-serif;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.18s ease, transform 0.18s ease;
    }
    #pill.show { opacity: 1; transform: none; }
    #pill small { font-weight: 400; opacity: 0.7; margin-left: 8px; }
  </style>
</head>
<body>
  <div id="pill"></div>
  <script>
    // Called from the main process via executeJavaScript.
    window.showToast = (text, note) => {
      const pill = document.getElementById('pill');
      pill.textContent = text;
      if (note) {
        const small = document.createElement('small');
        small.textContent = note;
        pill.appendChild(small);
      }
      pill.classList.remove('show');
      requestAnimationFrame(() => pill.classList.add('show'));
    };
    window.hideToast = () => document.getElementById('pill').classList.remove('show');
  </script>
</body>
</html>
